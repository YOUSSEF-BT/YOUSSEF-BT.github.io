<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid Real-Time Accident Detection Architecture</title>
  <desc id="desc">Video input is processed by YOLOv11n and BoT-SORT, then split into a visual YOLOv11s branch and an alpha beta gamma behavioral branch before decision fusion and accident evidence output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101d"/>
      <stop offset="1" stop-color="#0d2036"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17d9c4"/>
      <stop offset="1" stop-color="#208cff"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4f68"/>
      <stop offset="1" stop-color="#ff8b42"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0 0 L14 7 L0 14 Z" fill="#75c6ff"/>
    </marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0 0 L14 7 L0 14 Z" fill="#ff725e"/>
    </marker>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#8ac9ff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1800" height="1050" fill="url(#bg)"/>
  <rect width="1800" height="1050" fill="url(#grid)"/>

  <text x="90" y="80" fill="#f6fbff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">Hybrid Real-Time Accident Detection Architecture</text>
  <text x="92" y="120" fill="#91a8bf" font-family="Inter, Arial, sans-serif" font-size="20">YOLOv11n + BoT-SORT + fine-tuned YOLOv11s + behavioral heuristic αβγ</text>

  <g filter="url(#shadow)">
    <g transform="translate(85 188)">
      <rect width="250" height="132" rx="24" fill="#10233a" stroke="#65c8ff" stroke-opacity="0.55"/>
      <circle cx="55" cy="66" r="28" fill="#163957"/>
      <path d="M35 54h42v30H35z" fill="none" stroke="#78d8ff" stroke-width="6" rx="4"/>
      <path d="M49 84h14M56 84v15M42 99h28" fill="none" stroke="#78d8ff" stroke-width="5" stroke-linecap="round"/>
      <text x="102" y="55" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Video Input</text>
      <text x="102" y="83" fill="#92a9c0" font-family="Inter, Arial, sans-serif" font-size="16">CCTV / local video</text>
    </g>

    <g transform="translate(425 188)">
      <rect width="290" height="132" rx="24" fill="#10233a" stroke="#65c8ff" stroke-opacity="0.55"/>
      <text x="28" y="47" fill="#72ddff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">OBJECT DETECTION</text>
      <text x="28" y="81" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800">YOLOv11n</text>
      <text x="28" y="108" fill="#92a9c0" font-family="Inter, Arial, sans-serif" font-size="16">Cars • motorcycles • buses • trucks</text>
    </g>

    <g transform="translate(805 188)">
      <rect width="290" height="132" rx="24" fill="#10233a" stroke="#65c8ff" stroke-opacity="0.55"/>
      <text x="28" y="47" fill="#72ddff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">MULTI-OBJECT TRACKING</text>
      <text x="28" y="81" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800">BoT-SORT</text>
      <text x="28" y="108" fill="#92a9c0" font-family="Inter, Arial, sans-serif" font-size="16">Stable IDs + trajectory history</text>
    </g>

    <g transform="translate(1185 188)">
      <rect width="510" height="132" rx="24" fill="#10233a" stroke="#65c8ff" stroke-opacity="0.55"/>
      <text x="30" y="47" fill="#72ddff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">TEMPORAL MEMORY</text>
      <text x="30" y="81" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800">90-frame trajectory history</text>
      <text x="30" y="108" fill="#92a9c0" font-family="Inter, Arial, sans-serif" font-size="16">Position • speed • acceleration • orientation</text>
    </g>
  </g>

  <path d="M335 254H410" fill="none" stroke="#75c6ff" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M715 254H790" fill="none" stroke="#75c6ff" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1095 254H1170" fill="none" stroke="#75c6ff" stroke-width="5" marker-end="url(#arrow)"/>

  <path d="M1440 320V390H560V448" fill="none" stroke="#75c6ff" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1440 390H1250V448" fill="none" stroke="#75c6ff" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <g transform="translate(205 448)">
      <rect width="710" height="245" rx="28" fill="#0e2439" stroke="#31d9c5" stroke-opacity="0.65"/>
      <rect width="12" height="245" rx="6" fill="url(#cyan)"/>
      <text x="42" y="47" fill="#63ecdc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">VISUAL ACCIDENT BRANCH</text>
      <text x="42" y="88" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800">Fine-tuned YOLOv11s — best.pt</text>
      <text x="42" y="123" fill="#9bb0c5" font-family="Inter, Arial, sans-serif" font-size="18">Direct image-based accident confidence</text>

      <g transform="translate(42 151)">
        <rect width="184" height="62" rx="15" fill="#122f46"/>
        <text x="18" y="25" fill="#8ea6bd" font-family="Inter, Arial, sans-serif" font-size="14">Precision</text>
        <text x="18" y="49" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800">86.68%</text>
      </g>
      <g transform="translate(242 151)">
        <rect width="184" height="62" rx="15" fill="#122f46"/>
        <text x="18" y="25" fill="#8ea6bd" font-family="Inter, Arial, sans-serif" font-size="14">Recall</text>
        <text x="18" y="49" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800">91.56%</text>
      </g>
      <g transform="translate(442 151)">
        <rect width="184" height="62" rx="15" fill="#122f46"/>
        <text x="18" y="25" fill="#8ea6bd" font-family="Inter, Arial, sans-serif" font-size="14">F1-score</text>
        <text x="18" y="49" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800">89.06%</text>
      </g>
    </g>

    <g transform="translate(985 448)">
      <rect width="710" height="245" rx="28" fill="#251a26" stroke="#ff705f" stroke-opacity="0.72"/>
      <rect width="12" height="245" rx="6" fill="url(#orange)"/>
      <text x="42" y="47" fill="#ff897a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">BEHAVIORAL ACCIDENT BRANCH</text>
      <text x="42" y="88" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800">Heuristic α + β + γ</text>
      <text x="42" y="123" fill="#bca6ae" font-family="Inter, Arial, sans-serif" font-size="18">Temporal anomaly analysis from tracked motion</text>

      <g transform="translate(42 151)">
        <rect width="184" height="62" rx="15" fill="#342331"/>
        <text x="18" y="25" fill="#c9a9b2" font-family="Inter, Arial, sans-serif" font-size="14">α — Proximity</text>
        <text x="18" y="49" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Relative distance</text>
      </g>
      <g transform="translate(242 151)">
        <rect width="184" height="62" rx="15" fill="#342331"/>
        <text x="18" y="25" fill="#c9a9b2" font-family="Inter, Arial, sans-serif" font-size="14">β — Trajectory</text>
        <text x="18" y="49" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Motion rupture</text>
      </g>
      <g transform="translate(442 151)">
        <rect width="184" height="62" rx="15" fill="#342331"/>
        <text x="18" y="25" fill="#c9a9b2" font-family="Inter, Arial, sans-serif" font-size="14">γ — Single vehicle</text>
        <text x="18" y="49" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Abnormal state</text>
      </g>
    </g>
  </g>

  <path d="M560 693V770H820" fill="none" stroke="#52dcca" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1340 693V770H980" fill="none" stroke="#ff725e" stroke-width="5" marker-end="url(#arrowOrange)"/>

  <g transform="translate(690 744)" filter="url(#shadow)">
    <rect width="420" height="152" rx="30" fill="#16243b" stroke="#9acbff" stroke-opacity="0.62"/>
    <text x="32" y="45" fill="#91bfff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">DECISION FUSION</text>
    <text x="32" y="87" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800">max(score visual, heuristic)</text>
    <text x="32" y="122" fill="#9eb1c5" font-family="Inter, Arial, sans-serif" font-size="18">Alert thresholds: 0.6 / strong alert: 0.8</text>
  </g>

  <path d="M900 896V934" fill="none" stroke="#75c6ff" stroke-width="5" marker-end="url(#arrow)"/>

  <g transform="translate(300 934)">
    <rect width="1200" height="86" rx="24" fill="url(#orange)" filter="url(#shadow)"/>
    <text x="600" y="55" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">ACCIDENT overlay  •  MP4 evidence clip  •  CSV event log  •  triggering frame</text>
  </g>
</svg>