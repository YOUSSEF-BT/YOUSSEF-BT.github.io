name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild and verify PFE project cover
        shell: bash
        run: |
          set -euo pipefail
          output="public/assets/images/projects/accident-detection/main-cover-final-v6.webp"
          mkdir -p "$(dirname "$output")"
          tr -d '\r\n' < build-assets/pfe-cover/part00.b64 | base64 --decode > "$output"

          python3 - "$output" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          data = path.read_bytes()
          assert data[:4] == b"RIFF", "Missing RIFF header"
          assert data[8:12] == b"WEBP", "Missing WEBP signature"
          declared_size = int.from_bytes(data[4:8], "little") + 8
          assert declared_size == len(data), (
              f"Invalid WebP length: header={declared_size}, actual={len(data)}"
          )
          assert len(data) > 30000, f"Unexpectedly small cover: {len(data)} bytes"
          print(f"Verified PFE cover: {len(data)} bytes")
          PY

      - name: Build portfolio
        run: npm run build

      - name: Verify PFE cover in production build
        shell: bash
        run: |
          set -euo pipefail
          output="dist/assets/images/projects/accident-detection/main-cover-final-v6.webp"
          python3 - "$output" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          data = path.read_bytes()
          assert data[:4] == b"RIFF"
          assert data[8:12] == b"WEBP"
          assert int.from_bytes(data[4:8], "little") + 8 == len(data)
          print(f"Verified deployed PFE cover: {len(data)} bytes")
          PY

      - name: Publish complete build to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
