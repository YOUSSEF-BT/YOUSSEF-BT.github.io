name: Export certifications list

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-certifications-list.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export certifications list
        run: python3 scripts/export_certifications_list.py

      - name: Commit change
        run: |
          git config user.name "YOUSSEF-BT"
          git config user.email "YOUSSEF-BT@users.noreply.github.com"
          git add src/pages/CertificationsPage.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Export certifications list for homepage"
            git push origin main
          fi
