name: Add Oracle AI Database certification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-oracle-ai-database-cert.yml'

permissions:
  contents: write

jobs:
  update-certifications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update certification sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          credential_id = "7022BC9CA3F2FE2B58B4706AE7646E5212D5D17F87BAA6D5A3E1B137AF38CE50"
          credential_url = f"https://catalog-education.oracle.com/pls/certview/sharebadge?id={credential_id}"
          new_block = f'''  {{
            id: 113,
            title: "Oracle AI Database Certified Foundations Associate",
            issuer: "Oracle",
            date: "Sep 2026 · Expires Sep 2028",
            credentialId: "{credential_id}",
            description: "Foundational certification in Oracle AI Database, covering core concepts for AI-enabled database technologies, data management, and AI-oriented database capabilities.",
            icon: <Award className="w-6 h-6" />,
            link: "{credential_url}",
            category: "data-science",
          }},
'''

          for file_name in ["src/pages/CertificationsPage.jsx", "src/data/certifications.js"]:
              path = Path(file_name)
              text = path.read_text()

              # Remove the old local-PDF special case from Oracle Agentic AI so it behaves like normal cards.
              text = text.replace('    pdfLink: `${import.meta.env.BASE_URL}documents/Oracle_Agentic_AI_Certified_Foundations_Associate.pdf`,\n', '')

              if 'id: 113,' not in text:
                  anchor = '    category: "agentic-ai-llms",\n  },\n];'
                  replacement = '    category: "agentic-ai-llms",\n  },\n' + new_block + '];'
                  if anchor not in text:
                      raise SystemExit(f"Could not find insertion anchor in {file_name}")
                  text = text.replace(anchor, replacement, 1)

              path.write_text(text)

          # Remove the temporary Oracle CSS workaround; both Oracle cards now use the normal card renderer.
          css_path = Path("src/index.css")
          css = css_path.read_text()
          marker = "\n/* Oracle:"
          if marker in css:
              css = css.split(marker, 1)[0].rstrip() + "\n"
              css_path.write_text(css)
          PY

      - name: Commit update
        shell: bash
        run: |
          git config user.name "YOUSSEF-BT"
          git config user.email "YOUSSEF-BT@users.noreply.github.com"
          git add src/pages/CertificationsPage.jsx src/data/certifications.js src/index.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Oracle AI Database certification"
            git push origin main
          fi
