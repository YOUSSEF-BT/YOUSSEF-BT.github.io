name: Add certification issuer logos

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-certification-logos.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply certification logo update
        run: python3 scripts/add_certification_logos.py

      - name: Build portfolio
        run: |
          npm ci
          npm run build

      - name: Commit changes
        run: |
          git config user.name "YOUSSEF-BT"
          git config user.email "YOUSSEF-BT@users.noreply.github.com"
          git add src/pages/CertificationsPage.jsx src/sections/Certifications.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Show issuer logos on certification cards"
            git push origin main
          fi
