name: Apply certification update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-certification-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply certification update
        run: python3 scripts/add_oracle_ai_database_cert.py

      - name: Commit source changes
        run: |
          git config user.name "YOUSSEF-BT"
          git config user.email "YOUSSEF-BT@users.noreply.github.com"
          git add src/pages/CertificationsPage.jsx src/data/certifications.js src/index.css
          git commit -m "Add Oracle AI Database certification"
          git push origin main
