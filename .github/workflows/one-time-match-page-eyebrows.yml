name: One-time match page eyebrows

on:
  push:
    branches: [main]
    paths:
      - "scripts/one_time_match_page_eyebrows.py"

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match Certifications and Projects title badge to Skills
        run: python3 scripts/one_time_match_page_eyebrows.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Verify production build
        run: npm run build

      - name: Commit verified title styling
        run: |
          git config user.name "YOUSSEF-BT"
          git config user.email "YOUSSEF-BT@users.noreply.github.com"
          git add src/pages/CertificationsPage.jsx src/pages/Demos.jsx
          git commit -m "Match page title badges to Skills"
          git push origin main
