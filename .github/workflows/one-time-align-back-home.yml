name: One-time align Back Home buttons

on:
  push:
    branches: [main]
    paths:
      - "scripts/one_time_align_back_home.py"

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align Certifications and Projects with Skills
        run: python3 scripts/one_time_align_back_home.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Verify production build
        run: npm run build

      - name: Commit verified alignment
        run: |
          git config user.name "YOUSSEF-BT"
          git config user.email "YOUSSEF-BT@users.noreply.github.com"
          git add src/pages/CertificationsPage.jsx src/pages/Demos.jsx
          git commit -m "Align Back Home buttons across pages"
          git push origin main
