name: Update certification dates

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-certification-dates.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update certification dates
        run: python3 scripts/update_certification_dates.py

      - name: Commit changes
        run: |
          git config user.name "YOUSSEF-BT"
          git config user.email "YOUSSEF-BT@users.noreply.github.com"
          git add src/pages/CertificationsPage.jsx src/data/certifications.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add months to certification dates"
            git push origin main
          fi
